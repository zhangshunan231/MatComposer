[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [
  "material_cache",
  "__pycache__",
  ".vscode",
]

[tool.pyright]
pythonVersion = "3.10"
pythonPlatform = "Windows"
typeCheckingMode = "basic"
reportMissingImports = false
exclude = [
  "material_cache",
  "__pycache__",
  ".vscode",
]
